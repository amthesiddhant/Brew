<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brew</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar"></div>

  <!-- Animated background particles -->
  <div class="particles" id="particles"></div>

  <!-- Coffee steam overlay (visible when active) -->
  <div class="steam-overlay" id="steamOverlay">
    <div class="steam-particle s1"></div>
    <div class="steam-particle s2"></div>
    <div class="steam-particle s3"></div>
    <div class="steam-particle s4"></div>
    <div class="steam-particle s5"></div>
    <div class="steam-particle s6"></div>
    <div class="steam-particle s7"></div>
    <div class="steam-particle s8"></div>
  </div>

  <div class="container">
    <!-- App Icon -->
    <div class="app-icon-wrapper" id="appIconWrapper">
      <div class="icon-glow" id="iconGlow"></div>
      <img src="assets/icon.png" alt="Brew" class="app-icon" id="appIcon">
      <div class="icon-ring" id="iconRing"></div>
    </div>

    <!-- App Title -->
    <div class="app-header">
      <h1 class="app-title" id="appTitle">Brew</h1>
      <p class="app-subtitle" id="statusText">Your Mac can sleep</p>
    </div>

    <!-- Status Indicator -->
    <div class="status-indicator" id="statusIndicator">
      <div class="pulse-ring ring-1" id="pulseRing1"></div>
      <div class="pulse-ring ring-2" id="pulseRing2"></div>
      <div class="pulse-ring ring-3" id="pulseRing3"></div>
      <div class="status-dot" id="statusDot"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-on" id="btnOn" onclick="turnOn()">
        <div class="btn-shine"></div>
        <svg viewBox="0 0 24 24" class="btn-icon">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M6 1v3M10 1v3M14 1v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>BREW ON</span>
      </button>

      <button class="btn btn-off" id="btnOff" onclick="turnOff()">
        <div class="btn-shine"></div>
        <svg viewBox="0 0 24 24" class="btn-icon">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 8v4l2 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>BREW OFF</span>
      </button>
    </div>

    <!-- Slack Mode Toggle -->
    <div class="slack-toggle" id="slackToggle">
      <div class="slack-toggle-row" onclick="toggleSlackMode()">
        <div class="slack-icon-wrap">
          <svg viewBox="0 0 24 24" class="slack-svg" id="slackIcon">
            <!-- Slack-style icon -->
            <path d="M14.5 2a2 2 0 1 0 0 4h2V4a2 2 0 0 0-2-2z" fill="currentColor"/>
            <path d="M2 14.5a2 2 0 1 0 4 0v-2H4a2 2 0 0 0-2 2z" fill="currentColor"/>
            <path d="M22 9.5a2 2 0 1 0-4 0v2h2a2 2 0 0 0 2-2z" fill="currentColor"/>
            <path d="M9.5 22a2 2 0 1 0 0-4h-2v2a2 2 0 0 0 2 2z" fill="currentColor"/>
            <path d="M6 14.5V16h8v-1.5a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2z" fill="currentColor" opacity="0.5"/>
            <path d="M14.5 6H16v8h-1.5a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2H16" fill="none" stroke="currentColor" stroke-width="0.5"/>
          </svg>
        </div>
        <div class="slack-info">
          <span class="slack-label">Keep Slack Online</span>
          <span class="slack-desc" id="slackDesc">Simulates activity every 4 min</span>
        </div>
        <div class="toggle-switch" id="toggleSwitch">
          <div class="toggle-knob" id="toggleKnob"></div>
        </div>
      </div>
    </div>

    <!-- Timer -->
    <div class="timer" id="timerSection">
      <p class="timer-label">Brewing for</p>
      <p class="timer-value" id="timerValue">00:00:00</p>
      <div class="timer-bar">
        <div class="timer-bar-fill" id="timerBarFill"></div>
      </div>
    </div>

    <!-- Update Section -->
    <div class="update-section" id="updateSection">
      <div class="update-row" onclick="checkForUpdates()">
        <div class="update-icon-wrap" id="updateIconWrap">
          <!-- Coffee cup icon for update -->
          <svg viewBox="0 0 24 24" class="update-svg" id="updateIcon">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <!-- Coffee liquid fill (animated during check) -->
          <div class="coffee-fill" id="coffeeFill"></div>
          <!-- Steam wisps -->
          <div class="update-steam" id="updateSteam">
            <div class="update-steam-wisp w1"></div>
            <div class="update-steam-wisp w2"></div>
            <div class="update-steam-wisp w3"></div>
          </div>
        </div>
        <div class="update-info">
          <span class="update-label" id="updateLabel">Check for Updates</span>
          <span class="update-desc" id="updateDesc">v<span id="currentVersion">1.0.0</span></span>
        </div>
        <div class="update-badge" id="updateBadge" style="display: none;">
          <span>NEW</span>
        </div>
        <div class="update-arrow" id="updateArrow">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <!-- Update details panel (shown when update available) -->
      <div class="update-details" id="updateDetails" style="display: none;">
        <div class="update-details-content">
          <p class="update-new-version">Version <span id="latestVersion"></span> available</p>
          <p class="update-notes" id="updateNotes"></p>

          <!-- Download & Install button -->
          <button class="btn-update" id="btnUpdate" onclick="downloadUpdate()">
            <svg viewBox="0 0 24 24" class="btn-update-icon">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <polyline points="7 10 12 15 17 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="12" y1="15" x2="12" y2="3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Download &amp; Install</span>
          </button>

          <!-- Progress bar (shown during download) -->
          <div class="update-progress" id="updateProgress" style="display: none;">
            <div class="update-progress-label" id="updateProgressLabel">Downloading...</div>
            <div class="update-progress-bar">
              <div class="update-progress-fill" id="updateProgressFill"></div>
            </div>
            <div class="update-progress-percent" id="updateProgressPercent">0%</div>
          </div>

          <!-- Restart button (shown after install) -->
          <button class="btn-restart" id="btnRestart" style="display: none;" onclick="restartApp()">
            <svg viewBox="0 0 24 24" class="btn-update-icon">
              <path d="M23 4v6h-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Restart Brew</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>Powered by macOS caffeinate</p>
      <p class="footer-hint">Prevents display & system sleep</p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
